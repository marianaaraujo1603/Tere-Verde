<body>

 <!--navbar-->
    <nav class="navbar navbar-dark navbar-expand-md" id="adm">
        <div class="container-fluid">
          <a class="navbar-brand" href="/">TERE-VERDE</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>
  </nav>

   
<p class="topo"><strong>Bem Vindos ao</strong></p>
<p class="topo"><strong>Painel Administrativo • Terê Verde</strong></p>
   

<div class="container">

        <h1>Gerenciar Eventos</h1>

        <h2>Cadastrar Novo Evento</h2>

       <form id="form-evento">
    <input type="text" id="titulo" placeholder="Título do evento" required>

    <textarea id="descricao" placeholder="Descrição" required></textarea>

    <input type="date" id="data" required>

    <input type="time" id="horario" required>

    <select id="local" required>
        <option value="">Selecione o parque...</option>
        <option value="Parnaso">Parnaso</option>
        <option value="Três Picos">Três Picos</option>
        <option value="Montanhas de Teresópolis">Montanhas de Teresópolis</option>
    </select>

    <button type="submit">Cadastrar Evento</button>
</form>

<p id="msgSucesso" style="color: green; font-weight: bold; display:none;">
    Evento cadastrado com sucesso!
</p>


        <h2>Eventos Cadastrados</h2>

        <table>
            <thead>
                <tr>
                  <th>Título</th><th>Data</th> <th>Horário</th> <th>Descrição</th> <th>Local</th> </tr>
                </tr>
            </thead>
            <tbody id="listaEventos"></tbody>
        </table>

    </div>

<script>
async function carregarEventos() {
    const resposta = await fetch('/api/eventos');
    const eventos = await resposta.json();

    const tabela = document.getElementById("listaEventos");
    tabela.innerHTML = "";

    eventos.forEach((ev, index) => {
        const linha = document.createElement("tr");

        linha.innerHTML = `
            <td>${ev.titulo}</td>
            <td>${ev.data}</td>
            <td>${ev.horario}</td>
            <td>${ev.descricao}</td>
            <td>${ev.local}</td>
            <td>
                <button class="btn-editar" onclick="editarEvento(${index})">Editar</button>
                <button class="btn-excluir" onclick="excluirEvento(${index})">Excluir</button>
            </td>
        `;

        tabela.appendChild(linha);
    });
}

async function cadastrarEvento(event) {
    event.preventDefault();

    const titulo = document.getElementById("titulo").value;
    const descricao = document.getElementById("descricao").value;
    const data = document.getElementById("data").value;
    const horario = document.getElementById("horario").value;
    const local = document.getElementById("local").value;

    const resposta = await fetch('/api/eventos', {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ titulo, descricao, data, horario, local })
    });

    if (resposta.ok) {
        document.getElementById("msgSucesso").style.display = "block";
        setTimeout(() => document.getElementById("msgSucesso").style.display = "none", 3000);

        document.getElementById("form-evento").reset();
        carregarEventos();
    } else {
        alert("Erro ao cadastrar evento.");
    }
}

async function excluirEvento(id) {
    await fetch(`/api/eventos/${id}`, { method: "DELETE" });
    carregarEventos();
}

function editarEvento(id) {
    alert("Função editar não está disponível no momento");
}

document.getElementById("form-evento").addEventListener("submit", cadastrarEvento);

carregarEventos();
</script>


</body>
