<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Parnaso</title>

  <link rel="stylesheet" href="CSS/parques.css">
  <link rel="shortcut icon" href="./Imagens/unifeso-logo.png" type="image/x-icon" />
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous" />

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

</head>
<body>

 <!--navbar-->
    <nav class="navbar navbar-dark navbar-expand-md" id="parnaso">
        <div class="container-fluid">
          <a class="navbar-brand" href="/">HOME</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
    </div>
  </nav>


<div class="parque-container" id="conteudo">
  <h1>Carregando informações...</h1>
</div>

<div class="galeria">
<h2>GALERIA DE FOTOS:</h2>
</div>

<section class="galeria">
  <div id="carouselFotos" class="carousel slide" data-ride="carousel">
    <div class="carousel-inner">

      <div class="carousel-item active">
        <img src="Imagens/parnaso1.jpg" class="d-block w-100" alt="Foto do parque">
      </div>
      <div class="carousel-item">
        <img src="Imagens/parnaso 2.jpg" class="d-block w-100" alt="Foto do parque">
      </div>

      <div class="carousel-item">
        <img src="Imagens/parnaso 3.jpg" class="d-block w-100" alt="Foto do parque">
      </div>
    </div>

    <a class="carousel-control-prev" href="#carouselFotos" role="button" data-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="sr-only">Anterior</span>
    </a>

    <a class="carousel-control-next" href="#carouselFotos" role="button" data-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="sr-only">Próximo</span>
    </a>
  </div>
</section>

<div class="voltar-container">
  <a href="index.html" class="btn-voltar">← Voltar</a>
</div>


<script>
async function carregarParque() {
  const resposta = await fetch("/api/parnaso");
  const parque = await resposta.json();

  document.getElementById("conteudo").innerHTML = `
    <h1>${parque.nome}</h1>

    <h2>Localização</h2>
    <p>${parque.localizacao}</p>

    <h2>Horário de Funcionamento</h2>
    <p>${parque.horario}</p>

    <h2>Contato</h2>
    <p>${parque.contato}</p>

    <h2>Descrição</h2>
    <p>${parque.descricao}</p>

    <h2>Trilhas</h2>
    <table>
      <tr><th>Trilha</th><th>Nível</th><th>Tempo</th></tr>
      ${parque.trilhas.map(t => `
        <tr>
          <td>${t.nome}</td>
          <td>${t["nível"]}</td>
          <td>${t.tempo}</td>
        </tr>
      `).join("")}
    </table>

    <h2>Cachoeiras</h2>
    <table>
      <tr><th>Nome</th><th>Acesso</th><th>Indicado para</th></tr>
      ${parque.cachoeiras.map(c => `
        <tr>
          <td>${c.nome}</td>
          <td>${c.acesso}</td>
          <td>${c.indicadoPara}</td>
        </tr>
      `).join("")}
    </table>

    <h2>Biodiversidade</h2>
    <p><strong>Fauna:</strong> ${parque.biodiversidade.fauna.join(", ")}</p>
    <p><strong>Flora:</strong> ${parque.biodiversidade.flora.join(", ")}</p>
  `;
}

carregarParque();
</script>

</body>
</html>
